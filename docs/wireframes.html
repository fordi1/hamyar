<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hamyar wireframes</title>
<!-- Phase 2 wireframes: static, sample data only. Not the product. -->
<style>
@font-face { font-family: "Vazirmatn"; src: url("../web/public/fonts/Vazirmatn-Variable.woff2") format("woff2"); font-weight: 100 900; }
:root {
  --bg: #f6f7fd; --surface: #fff; --surface-2: #f1f3fb; --border: #e4e7f2; --border-strong: #cfd5e8;
  --text: #161a33; --text-2: #4a5175; --text-3: #6b7293;
  --primary: #3d4ee8; --primary-hover: #2f3fd6; --primary-soft: #eceffe;
  --violet: #8b5cf6; --violet-soft: #f3eefe;
  --success: #12a150; --success-soft: #e8f7ee; --warning: #c27803; --warning-soft: #fdf4e3;
  --danger: #dc2f45; --danger-soft: #fdecee; --info: #2f80ed; --info-soft: #eaf2fe;
  --radius-sm: 8px; --radius: 12px; --radius-lg: 16px; --radius-xl: 20px;
  --shadow-1: 0 1px 2px rgba(22,26,51,.04), 0 1px 3px rgba(22,26,51,.06);
  --shadow-2: 0 4px 16px rgba(61,78,232,.08);
  --control-h: 44px;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: Vazirmatn, system-ui, sans-serif; background: #e9ebf5; color: var(--text); font-size: 14px; line-height: 1.7; }
button, input, select, textarea { font: inherit; color: inherit; }
.ico { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- document chrome (not part of the product) ---------- */
.doc-bar { position: sticky; top: 0; z-index: 10; background: #fff; border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.doc-bar h1 { font-size: 15px; margin: 0 0 0 12px; white-space: nowrap; }
.doc-bar .note { color: var(--text-3); font-size: 12px; flex-basis: 100%; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { min-height: 36px; padding: 0 12px; border: 1px solid var(--border); background: var(--surface); border-radius: 999px; cursor: pointer; white-space: nowrap; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--primary); color: #fff; border-color: var(--primary); }
.stage { padding: 24px 16px 64px; display: flex; justify-content: center; }
.frame { container-type: inline-size; width: min(1280px, 100%); background: var(--bg); border-radius: 18px; box-shadow: 0 10px 40px rgba(22,26,51,.12); overflow: hidden; }
.frame.mobile { width: 375px; max-width: 100%; border-radius: 28px; }
.caption { max-width: 1280px; margin: 0 auto 12px; color: var(--text-2); font-size: 13px; padding: 0 16px; }

/* ---------- product shell ---------- */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr) 300px; min-height: 760px; }
.app.no-panel { grid-template-columns: 232px minmax(0, 1fr); }
.side { background: var(--surface); border-left: 1px solid var(--border); padding: 18px 12px; display: flex; flex-direction: column; gap: 4px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 17px; padding: 4px 8px 16px; }
.brand .logo { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, var(--primary), var(--violet)); display: grid; place-items: center; color: #fff; }
.nav a { display: flex; align-items: center; gap: 10px; min-height: 42px; padding: 0 12px; border-radius: 10px; color: var(--text-2); text-decoration: none; white-space: nowrap; }
.nav a.on { background: var(--primary-soft); color: var(--primary); font-weight: 700; }
.nav a .count { margin-inline-start: auto; background: var(--danger); color: #fff; font-size: 11px; border-radius: 999px; padding: 0 7px; line-height: 20px; }
.side .cta { margin-top: 8px; }
.side .helper { margin-top: auto; background: var(--violet-soft); border-radius: var(--radius); padding: 12px; display: flex; gap: 10px; align-items: center; font-size: 12px; color: var(--text-2); }
.side .helper b { display: block; color: var(--text); font-size: 13px; }

.main { display: flex; flex-direction: column; min-width: 0; }
.top { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--border); background: rgba(255,255,255,.7); }
.search { flex: 1; max-width: 340px; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; background: var(--surface-2); border-radius: 10px; color: var(--text-3); font-size: 13px; }
.top .grow { flex: 1; }
.iconbtn { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); display: grid; place-items: center; position: relative; color: var(--text-2); }
.iconbtn .badge { position: absolute; top: -4px; left: -4px; background: var(--danger); color: #fff; font-size: 10px; border-radius: 999px; min-width: 18px; line-height: 18px; text-align: center; }
.account { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-3); white-space: nowrap; }
.account b { display: block; color: var(--text); font-size: 13px; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; font-weight: 800; }
.app-pill { display: none; }
.content { padding: 24px; display: flex; flex-direction: column; gap: 16px; flex: 1; }
.content.center { align-items: center; justify-content: center; text-align: center; }

.panel { background: var(--surface); border-right: 1px solid var(--border); padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; }
.panel h3 { margin: 0; font-size: 14px; }
.panel .appsel { display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid var(--border); border-radius: var(--radius); }
.panel .appsel small { color: var(--text-3); display: block; }
.tiles2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.tabbar { display: none; }

/* ---------- primitives ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-1); padding: 16px; }
.card h4 { margin: 0 0 4px; font-size: 15px; }
.muted { color: var(--text-3); font-size: 13px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.row.between { justify-content: space-between; }
.btn { min-height: var(--control-h); padding: 0 18px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface); white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; cursor: pointer; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.danger { color: var(--danger); border-color: #f3c3ca; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--primary); }
.btn.block { width: 100%; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.ok { background: var(--success-soft); color: var(--success); }
.pill.warn { background: var(--warning-soft); color: var(--warning); }
.pill.bad { background: var(--danger-soft); color: var(--danger); }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill.violet { background: var(--violet-soft); color: var(--violet); }
.pill.gray { background: var(--surface-2); color: var(--text-3); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.src { font-size: 11px; color: var(--text-3); }
.metric { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
.metric .label { font-size: 12px; color: var(--text-3); }
.metric .val { font-size: 20px; font-weight: 800; }
.metric .val small { font-size: 12px; color: var(--text-3); font-weight: 500; }
.bar { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--primary); border-radius: inherit; }
.bar.violet i { background: var(--violet); }
.unavail { border: 1px dashed var(--border-strong); background: var(--surface-2); border-radius: var(--radius); padding: 12px; color: var(--text-3); font-size: 12px; }
.field { display: flex; flex-direction: column; gap: 6px; text-align: start; }
.field label { font-size: 13px; font-weight: 600; }
.input { min-height: var(--control-h); border: 1px solid var(--border-strong); border-radius: 10px; padding: 0 12px; display: flex; align-items: center; gap: 8px; background: var(--surface); color: var(--text-3); font-size: 13px; direction: ltr; justify-content: flex-end; }
.input.rtl { direction: rtl; justify-content: flex-start; }
.input.ok { border-color: var(--success); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
code, .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; direction: ltr; unicode-bidi: isolate; }
details summary { cursor: pointer; color: var(--primary); font-size: 13px; }

/* chat */
.msg { max-width: 80%; padding: 10px 14px; border-radius: 14px; }
.msg.user { align-self: flex-start; background: var(--primary); color: #fff; border-end-start-radius: 4px; }
.msg.bot { align-self: flex-end; background: var(--surface); border: 1px solid var(--border); border-end-end-radius: 4px; }
.bot-row { display: flex; gap: 10px; align-items: flex-start; }
.composer { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-2); padding: 12px; display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 720px; }
.composer .ph { color: var(--text-3); min-height: 44px; text-align: start; }
.composer .send { width: 44px; height: 44px; border-radius: 12px; background: var(--primary); color: #fff; display: grid; place-items: center; border: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chip { min-height: 44px; padding: 0 16px; border: 1px solid var(--border); background: var(--surface); border-radius: 12px; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; font-size: 13px; box-shadow: var(--shadow-1); }
.chip .ico { color: var(--primary); }

/* stepper */
.stepper { display: flex; justify-content: space-between; position: relative; margin: 4px 24px 8px; }
.stepper::before { content: ""; position: absolute; top: 15px; inset-inline: 30px; height: 2px; background: var(--border); }
.step { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: var(--text-3); z-index: 1; }
.step i { width: 32px; height: 32px; border-radius: 50%; background: var(--surface); border: 2px solid var(--border-strong); display: grid; place-items: center; font-style: normal; font-weight: 700; }
.step.on { color: var(--primary); font-weight: 700; }
.step.on i { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: 0 0 0 4px var(--primary-soft); }
.step.done i { background: var(--primary); border-color: var(--primary); color: #fff; }
.step-mobile { display: none; }
.h-title { text-align: center; }
.h-title h2 { margin: 0; font-size: 22px; }

/* source chooser */
.sources { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.source { border: 1.5px solid var(--border); border-radius: var(--radius-lg); padding: 16px; display: flex; flex-direction: column; gap: 8px; background: var(--surface); text-align: start; }
.source.on { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }
.source .sicon { width: 40px; height: 40px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; color: var(--primary); }

/* plans */
.plans { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.plan { border: 1.5px solid var(--border); border-radius: var(--radius-lg); padding: 16px; display: flex; flex-direction: column; gap: 8px; background: var(--surface); position: relative; }
.plan.rec { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }
.plan ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; color: var(--text-2); font-size: 13px; }
.plan ul li { display: flex; gap: 8px; align-items: center; }
.price { font-size: 18px; font-weight: 800; }
.price small { font-size: 12px; color: var(--text-3); font-weight: 500; }

/* timeline */
.tl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.tl li { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: start; padding: 8px 0; position: relative; }
.tl li::before { content: ""; position: absolute; right: 13px; top: 34px; bottom: -6px; width: 2px; background: var(--border); }
.tl li:last-child::before { display: none; }
.tl .st { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--text-3); z-index: 1; }
.tl .st.done { background: var(--success); color: #fff; }
.tl .st.run { background: var(--primary-soft); color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.tl .st.fail { background: var(--danger); color: #fff; }
.tl small { color: var(--text-3); display: block; }
.tl .t { color: var(--text-3); font-size: 12px; }

/* approval */
.approval { border: 1.5px solid var(--primary); border-radius: var(--radius-lg); background: var(--surface); overflow: hidden; }
.approval .ah { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--primary-soft); }
.approval .ab { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.kv { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.kv div { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; }
.kv span { display: block; font-size: 11px; color: var(--text-3); }
.kv b { font-size: 13px; }
.diff { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; font-size: 13px; }
.diff div { padding: 6px 12px; }
.diff .ico { vertical-align: -4px; margin-inline-end: 6px; }
.diff .add { background: var(--success-soft); }
.diff .chg { background: var(--warning-soft); }

/* charts */
.chart { height: 150px; position: relative; }
.chart svg { width: 100%; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--text-3); }

/* logs */
.logs { font-family: ui-monospace, Consolas, monospace; font-size: 12px; direction: ltr; }
.logs .l { display: grid; grid-template-columns: 64px 60px 1fr; gap: 10px; padding: 7px 4px; border-bottom: 1px solid var(--border); align-items: start; }
.lvl { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 6px; text-align: center; }
.lvl.e { background: var(--danger-soft); color: var(--danger); }
.lvl.w { background: var(--warning-soft); color: var(--warning); }
.lvl.i { background: var(--info-soft); color: var(--info); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); overflow-x: auto; }
.tabs a { padding: 10px 14px; color: var(--text-3); text-decoration: none; white-space: nowrap; border-bottom: 2px solid transparent; font-size: 13px; }
.tabs a.on { color: var(--primary); border-color: var(--primary); font-weight: 700; }

/* hypothesis board */
.hyp { border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.hyp.confirmed { border-color: #a8e0bf; background: var(--success-soft); }
.hyp.rejected { opacity: .85; background: var(--surface-2); }
.ev { display: flex; gap: 8px; font-size: 13px; align-items: baseline; }
.ev b { color: var(--primary); font-family: ui-monospace, monospace; direction: ltr; }
.vt { width: 100%; border-collapse: collapse; font-size: 13px; }
.vt th, .vt td { padding: 8px; border-bottom: 1px solid var(--border); text-align: start; }
.vt th { color: var(--text-3); font-weight: 600; font-size: 12px; }

/* mascot */
.mascot { width: 120px; height: 120px; }
.mascot.sm { width: 34px; height: 34px; }

/* ---------- responsive by container (the same rules move into the product) ---------- */
@container (max-width: 1100px) {
  .app, .app.no-panel { grid-template-columns: 72px minmax(0, 1fr); }
  .panel { display: none; }
  .side .label, .side .helper, .brand span, .nav a .count { display: none; }
  .nav a { justify-content: center; padding: 0; }
  .side .cta { padding: 0; }
  .side .cta .label { display: none; }
  .app-pill { display: inline-flex; }
}
@container (max-width: 700px) {
  .app, .app.no-panel { grid-template-columns: 1fr; min-height: 720px; }
  .side { display: none; }
  .top { padding: 10px 12px; gap: 8px; }
  .search, .account div { display: none; }
  .content { padding: 16px 16px 88px; gap: 12px; }
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: sticky; bottom: 0; background: var(--surface); border-top: 1px solid var(--border); padding: 6px 4px 10px; }
  .tabbar a { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--text-3); text-decoration: none; min-height: 44px; justify-content: center; }
  .tabbar a.on { color: var(--primary); font-weight: 700; }
  .grid2, .grid3, .sources, .plans, .kv { grid-template-columns: 1fr; }
  .grid4, .tiles2, .kv { grid-template-columns: 1fr 1fr; }
  .source { display: grid; grid-template-columns: 40px 1fr; column-gap: 12px; row-gap: 0; padding: 12px; }
  .source .sicon { grid-row: span 2; }
  .stepper { display: none; }
  .step-mobile { display: flex; flex-direction: column; gap: 6px; }
  .msg { max-width: 92%; }
  .h-title h2 { font-size: 18px; }
  .logs .l { grid-template-columns: 1fr; gap: 2px; }
  .mascot { width: 88px; height: 88px; }
  .plan.rec { order: -1; }
  .row.actions > .btn { flex: 1 1 auto; }
  .vt thead { display: none; }
  .vt tr { display: grid; grid-template-columns: 1fr 1fr; }
  .vt td:nth-child(2)::before { content: "قبل: "; color: var(--text-3); font-size: 12px; }
  .vt td:nth-child(3)::before { content: "بعد: "; color: var(--text-3); font-size: 12px; }
  .vt td:first-child { grid-column: 1 / -1; font-weight: 700; border: 0; padding-bottom: 0; }
}
</style>
</head>

const frame = document.getElementById('frame');
const caption = document.getElementById('caption');
const seg = document.getElementById('screens');
let current = 'home';
seg.innerHTML = Object.entries(SCREENS).map(([k, s]) => `<button type="button" data-k="${k}" aria-pressed="${k === current}">${s.label}</button>`).join('');
function show(k) {
  current = k;
  frame.innerHTML = SCREENS[k].html();
  caption.textContent = SCREENS[k].caption;
  seg.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.k === k)));
}
seg.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) show(b.dataset.k); });
document.querySelectorAll('[data-vp]').forEach((b) => b.addEventListener('click', () => {
  frame.classList.toggle('mobile', b.dataset.vp === 'mobile');
  document.querySelectorAll('[data-vp]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
}));
show(location.hash.slice(1) in SCREENS ? location.hash.slice(1) : 'home');
